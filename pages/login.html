<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <title>Login Page</title>
  </head>
  <body
    class="d-flex justify-content-center align-items-center vh-100 position-relative"
  >
    <nav
      class="navbar d-flex justify-content-center align-items-center px-4 py-3 border-bottom border-2 mt-2 position-absolute top-0 container-lg" 
    >
      <h1 class="m-0">
        <a href="/index.html" class="text-decoration-none text-black fs-3" style="letter-spacing: 0.1em;"
          >E-Commerce</a
        >
      </h1>
    </nav>

    <div
      class="container border border-secondary rounded p-3 col-11 col-md-8 col-lg-6 shadow"
    >
      <h1 class="text-center mb-5 mt-3">Login</h1>

      <form>
        <div class="row">
          <div class="mb-3 col-lg-6">
            <label for="username" class="form-label">Username or Email</label>
            <input
              type="text"
              name="username"
              id="usernameOrEmail"
              class="form-control"
            />
          </div>

          <div class="mb-3 col-lg-6">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
            />
          </div>

          <div class="mb-5 mt-3 text-center">
            <button
              id="loginBtn"
              type="submit"
              class="btn btn-success col-12 col-lg-12"
            >
              Login
            </button>
          </div>
          <div
            id="successDiv"
            class="top-100 alert alert-success col-11 col-lg-6 mx-auto d-none"
          >
            <h3 class="text-center">Login Successful.</h3>
          </div>

          <div
            id="errorDiv"
            class="top-100 alert alert-danger col-11 col-lg-6 mx-auto d-none"
          >
            <h3 class="text-center fs-4">Account Not Found.</h3>
          </div>
        </div>
      </form>
      <hr />
      <p class="fw-medium">
        Don't Have an Account?
        <a
          href="/pages/register.html"
          class="text-decoration-underline text-success fw-bold"
          >Register</a
        >
      </p>
    </div>

    <script src="/js/bootstrap.bundle.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Out</title>
    <link rel="stylesheet" href="../css/bootstrap.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
  </head>
  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar bg-white border-bottom fixed-top">
      <div class="container d-flex align-items-center">
        <button
          class="btn btn-sm btn-outline-secondary"
          onclick="history.back()"
        >
          &#8592;
        </button>
        <h5 class="mb-0 mx-auto">Checkout</h5>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="container py-3">
      <div class="row g-3">
        <!-- LEFT COLUMN: Address + Shipping + Payment -->
        <div class="col-12 col-lg-7">
          <!-- SHIPPING ADDRESS -->
          <div class="card rounded-3 shadow-sm mb-3" id="section-address">
            <div class="card-body">
              <h6 class="fw-bold mb-3">📍 Shipping Address</h6>

              <div class="row g-2">
                <div class="col-12 col-sm-6">
                  <label class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="e.g. John Doe"
                  />
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label">Phone Number</label>
                  <input
                    type="tel"
                    class="form-control"
                    placeholder="e.g. +20 100 000 0000"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label">Street Address</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="e.g. 42 Nile St, Apt 3"
                  />
                </div>
                <div class="col-6">
                  <label class="form-label">City</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="e.g. Cairo"
                  />
                </div>
                <div class="col-6">
                  <label class="form-label">Country</label>
                  <select class="form-select">
                    <option value="">Select</option>
                    <option value="EG">Egypt</option>
                    <option value="SA">Saudi Arabia</option>
                    <option value="AE">UAE</option>
                    <option value="JO">Jordan</option>
                    <option value="KW">Kuwait</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- SHIPPING OPTIONS -->
          <div class="card rounded-3 shadow-sm mb-3" id="section-shipping">
            <div class="card-body">
              <h6 class="fw-bold mb-3">🚚 Shipping Options</h6>

              <div class="list-group">
                <label
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                >
                  <div class="d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="shipping"
                      value="standard"
                      checked
                    />
                    <div>
                      <div class="fw-semibold">Standard Delivery</div>
                      <small class="text-muted">3–5 business days</small>
                    </div>
                  </div>
                  <span class="badge bg-success rounded-pill">Free</span>
                </label>

                <label
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                >
                  <div class="d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="shipping"
                      value="express"
                    />
                    <div>
                      <div class="fw-semibold">Express Delivery</div>
                      <small class="text-muted">1–2 business days</small>
                    </div>
                  </div>
                  <span class="fw-semibold">$9.99</span>
                </label>

                <label
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                >
                  <div class="d-flex align-items-center gap-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="shipping"
                      value="overnight"
                    />
                    <div>
                      <div class="fw-semibold">Overnight Delivery</div>
                      <small class="text-muted">Next business day</small>
                    </div>
                  </div>
                  <span class="fw-semibold">$19.99</span>
                </label>
              </div>
            </div>
          </div>

          <!-- PAYMENT METHOD -->
          <div class="card rounded-3 shadow-sm mb-3" id="section-payment">
            <div class="card-body">
              <h6 class="fw-bold mb-3">💳 Payment Method</h6>

              <div class="list-group mb-3">
                <label
                  class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                >
                  <input
                    class="form-check-input"
                    type="radio"
                    name="payment"
                    checked
                  />
                  <span>💳 Credit / Debit Card</span>
                </label>
                <label
                  class="list-group-item list-group-item-action d-flex align-items-center gap-2"
                >
                  <input class="form-check-input" type="radio" name="payment" />
                  <span>💵 Cash on Delivery</span>
                </label>
              </div>

              <!-- Card fields -->
              <div id="cardFields">
                <div class="mb-3">
                  <label class="form-label">Card Number</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                  />
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Expiry Date</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="MM / YY"
                      maxlength="7"
                    />
                  </div>
                  <div class="col-6">
                    <label class="form-label">CVV</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="123"
                      maxlength="4"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- END LEFT COLUMN -->

        <!-- RIGHT COLUMN: Order Summary + Button -->
        <div class="col-12 col-lg-5">
          <div class="sticky-summary">
            <!-- ORDER SUMMARY -->
            <div class="card rounded-3 shadow-sm mb-3" id="section-summary">
              <div class="card-body">
                <h6 class="fw-bold mb-3">🧾 Order Summary</h6>

                <ul class="list-group list-group-flush mb-3" id="order-items">
                  <!-- dynamic from localStorage -->
                </ul>

                <div class="d-flex justify-content-between mb-1">
                  <span class="text-muted">Subtotal</span>
                  <span id="order-subtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                  <span class="text-muted">Shipping</span>
                  <span id="order-shipping" class="text-success fw-semibold"
                    >Free</span
                  >
                </div>
                <hr class="my-2" />
                <div class="d-flex justify-content-between fw-bold fs-6">
                  <span>Total</span>
                  <span id="order-total">$0.00</span>
                </div>
              </div>
            </div>

            <!-- PLACE ORDER — inline on desktop, sticky bar on mobile -->
            <!-- success toast: shows BELOW button on desktop -->
            <div
              id="order-success-toast"
              class="order-success-toast alert alert-success border border-success-subtle d-flex align-items-center fw-semibold mb-2 py-2"
            >
              ✅ Your order has been placed successfully!
            </div>
            <button
              id="place-order-desktop"
              class="btn btn-success w-100 py-3 fw-semibold fs-6 d-none d-lg-block place-order-btn"
            >
              Place Order
            </button>
          </div>
        </div>
        <!-- END RIGHT COLUMN -->
      </div>
    </main>

    <!-- mobile only -->
    <div
      class="d-lg-none position-fixed bottom-0 start-0 end-0 p-3 bg-white border-top"
    >
      <button
        id="place-order-mobile"
        class="btn btn-success w-100 py-3 fw-semibold fs-6 place-order-btn"
      >
        Place Order
      </button>
    </div>

    <script src="../js/bootstrap.bundle.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
